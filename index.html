<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UUM Handball Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efefed; --ink:#111; --muted:#8a8a86; --line:#bdbdb8;
    --blue:#26236a; --thin:140px; --wide:400px; --gh:364px; --big:min(52vh,460px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 40%,#fafaf8 0%,var(--bg) 70%);
    color:var(--ink);font-family:Archivo,system-ui,sans-serif;
    min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  header{padding:22px 20px 0;text-align:center;transition:opacity .4s,transform .4s}
  .logo{font-weight:800;letter-spacing:.18em;font-size:22px;text-transform:uppercase}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px}
  .logo img{height:44px;width:auto;display:block}
  .logo span{font-size:18px;color:var(--blue)}
  body.open header{opacity:0;transform:translateY(-10px);pointer-events:none}

  main{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 20px;min-height:560px}

  /* ---------- RACK ---------- */
  .rack-wrap{position:relative;width:100%;display:flex;justify-content:center;transition:filter .5s,opacity .5s}
  body.open .rack-wrap{opacity:.28;pointer-events:none}
  .bar{position:absolute;top:calc(var(--gh) * .03);left:50%;transform:translateX(-50%);width:min(94vw,740px);height:4px;border-radius:4px;
       background:linear-gradient(#d9d9d6,#a9a9a5)}
  .bar::before,.bar::after{content:"";position:absolute;top:-5px;width:4px;height:14px;background:#a9a9a5;border-radius:2px}
  .bar::before{left:0}.bar::after{right:0}
  .items{display:flex;align-items:flex-start;justify-content:center;gap:0;padding:0 10px;height:var(--gh)}
  .slot{position:relative;width:var(--thin);height:var(--gh);transition:width .55s cubic-bezier(.2,.8,.2,1);outline:none}
  .slot .g{position:absolute;top:0;left:50%;width:var(--wide);height:var(--gh);
           transform:translateX(-50%) scale(.5);transform-origin:50% 0;
           transition:transform .55s cubic-bezier(.2,.8,.2,1),filter .55s;filter:none;opacity:.92}
  .slot.active{width:var(--wide)}
  .slot.active .g{transform:translateX(-50%) scale(1);opacity:1}
  .slot:focus-visible .g{outline:2px dashed #999;outline-offset:4px}
  .g svg,.g img{width:100%;height:100%;display:block;object-fit:contain;
                filter:drop-shadow(0 14px 14px rgba(0,0,0,.14))}

  .caption{text-align:center;margin-top:18px;transition:opacity .4s;min-height:92px;padding:0 16px}
  body.open .caption{opacity:0;pointer-events:none}
  .cap-name{font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  .cap-meta{font-size:12px;color:var(--muted);margin-top:4px}
  .pill{display:inline-block;margin-top:14px;border:1.5px solid var(--ink);border-radius:999px;
        padding:8px 18px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,color .2s}
  .pill:hover{background:var(--ink);color:#fff}
  .hint{font-size:11px;color:var(--muted);margin-top:12px;letter-spacing:.05em}

  /* ---------- DETAIL ---------- */
  .detail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          opacity:0;pointer-events:none;transition:opacity .45s;padding:20px 0}
  body.open .detail{opacity:1;pointer-events:auto}
  .close{position:absolute;top:8px;right:16px;width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1}
  .close:hover{background:rgba(0,0,0,.06)}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;font-size:22px}
  .nav:hover{background:rgba(0,0,0,.06)}
  .nav.prev{left:10px}.nav.next{right:10px}
  .d-row{display:flex;align-items:flex-start;justify-content:center;transform:translateY(20px);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  body.open .d-row{transform:none}
  .fig{width:var(--big);height:calc(var(--big) * .911);transition:transform .16s ease-in}
  .fig.flip{transform:scaleX(0)}
  .fig svg,.fig img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.16))}
  .d-row{position:relative}
  .tags{display:flex;gap:7px;position:absolute;z-index:2;left:calc(50% + var(--big) * .36);top:calc(var(--big) * .1)}
  .tag{position:relative;width:26px;height:68px;border-radius:4px;margin-top:34px;transform-origin:50% -34px;
       background:var(--c);color:var(--t);box-shadow:0 4px 8px rgba(0,0,0,.15);transition:transform .25s}
  .tag::before{content:"";position:absolute;left:50%;top:-34px;width:1px;height:34px;background:#555}
  .tag::after{content:"";position:absolute;left:50%;top:7px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .tag span{position:absolute;left:0;right:0;top:18px;writing-mode:vertical-rl;margin:auto;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .tag.on{transform:translateY(8px);outline:2px solid var(--ink);outline-offset:2px}
  .tag.swing{animation:swing .7s ease-out}
  @keyframes swing{0%{rotate:0}25%{rotate:9deg}55%{rotate:-6deg}80%{rotate:3deg}100%{rotate:0}}
  .d-name{margin-top:18px;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:0 16px}
  .d-price{font-size:13px;color:var(--muted);margin-top:4px}
  .toggle{margin-top:12px;display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:2px}
  .toggle button{padding:6px 16px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:background .25s,color .25s}
  .toggle button.on{background:var(--ink);color:#fff}
  .link{margin-top:12px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-bottom:1.5px solid currentColor;padding-bottom:2px}

  /* ---------- AVAILABILITY SHEET ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
  .sheet{position:fixed;z-index:21;left:50%;bottom:0;width:min(100%,440px);background:#fff;border-radius:18px 18px 0 0;
         padding:22px 22px calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  body.sheet-on .scrim{opacity:1;pointer-events:auto}
  body.sheet-on .sheet{transform:translate(-50%,0)}
  .s-sizes-h{margin-top:16px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .s-sizes-h+.sizes{margin-top:8px}
  .grab{width:40px;height:4px;border-radius:4px;background:#ddd;margin:-8px auto 14px}
  .s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .s-title{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
  .s-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .s-close{font-size:22px;line-height:1;width:36px;height:36px;border-radius:50%}
  .sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
  .size{border:1.5px solid #ddd;border-radius:10px;padding:10px 4px;text-align:center;cursor:default}
  .size b{display:block;font-size:14px}
  .size small{font-size:10px;color:var(--muted)}
  .size.on{border-color:var(--ink)}
  .size.low small{color:#c46a00}
  .size.out{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .ask{display:block;width:100%;margin-top:18px;background:var(--ink);color:#fff;border-radius:999px;padding:14px;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;text-decoration:none}
  .ask[aria-disabled="true"]{opacity:.35}
  .s-label{display:none}
  .order{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px;border:1.5px solid #eee;border-radius:14px}
  .order img{width:112px;height:112px;flex:none;image-rendering:auto}
  .order-txt{font-size:12px;line-height:1.5;color:#444}
  .ask{background:var(--blue)}
  .sheet{max-height:92svh;overflow:auto}

  .loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:radial-gradient(ellipse at 50% 40%,#fafaf8 0%,var(--bg) 75%);transition:opacity .7s,visibility .7s}
  .loader.done{opacity:0;visibility:hidden}
  .loader img{width:min(44vw,190px);height:auto;animation:lfloat 2.4s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(38,35,106,.25))}
  .l-name{font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:16px;color:var(--blue);text-align:center;padding:0 20px}
  .l-bar{width:min(60vw,220px);height:3px;background:rgba(38,35,106,.15);border-radius:3px;overflow:hidden}
  .l-bar i{display:block;height:100%;width:0;background:var(--blue)}
  .l-pct{font-size:11px;color:var(--muted);letter-spacing:.1em}
  @keyframes lfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.03)}}
  @keyframes lfill{to{width:100%}}
  body.loading{overflow:hidden}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:0 16px 18px;letter-spacing:.06em}

  /* ---------- PHONE ---------- */
  @media (max-width:640px){
    :root{--thin:19vw;--wide:min(56vw,300px);--gh:calc(var(--wide) * .911);--big:min(82vw,380px)}
    .items{gap:0}
    .slot .g{transform:translateX(-50%) scale(.5)}
    main{min-height:auto;padding-top:24px}
    .bar{width:96vw}
    .tags{gap:5px;left:calc(50% + var(--big) * .39)}
    .tag{width:22px;height:58px}
    .nav{top:auto;bottom:6px;transform:none}
    .detail{padding-bottom:56px}
  }
  @media (max-height:720px) and (min-width:641px){:root{--wide:320px;--thin:115px;--gh:292px;--big:360px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="loading">
<div class="loader" id="loader" role="status" aria-label="Loading">
  <img src="images/logo.webp" alt="UUM Handball Team">
  <div class="l-name">UUM Handball Team</div>
  <div class="l-bar"><i></i></div>
  <div class="l-pct" id="lpct">0%</div>
</div>
<header><div class="logo" id="logo"></div></header>

<main id="stage">
  <div class="rack-wrap">
    <div class="bar"></div>
    <div class="items" id="items" role="listbox" aria-label="Products"></div>
  </div>
  <div class="caption" id="caption">
    <div class="cap-name" id="capName"></div>
    <div class="cap-meta" id="capMeta"></div>
    <button class="pill" id="capOpen">Sizes &amp; order</button>
    <div class="hint" id="hint"></div>
  </div>

  <section class="detail" id="detail" aria-hidden="true">
    <button class="close" id="close" aria-label="Close">✕</button>
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <button class="nav next" id="next" aria-label="Next">›</button>
    <div class="d-row">
      <div class="fig" id="fig"></div>
      <div class="tags" id="tags"></div>
    </div>
    <div class="d-name" id="dName"></div>
    <div class="d-price" id="dPrice"></div>
    <div class="toggle" role="group" aria-label="View side">
      <button id="front" class="on">Front</button>
      <button id="back">Back</button>
    </div>
    <button class="link" id="avail">Sizes &amp; order ↓</button>
  </section>
</main>

<footer id="footer"></footer>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Sizes and order">
  <div class="grab"></div>
  <div class="s-head">
    <div><div class="s-title" id="sTitle"></div><div class="s-sub" id="sSub"></div></div>
    <button class="s-close" id="sClose" aria-label="Close">✕</button>
  </div>
  <div class="s-sizes-h">Sizes available</div>
  <div class="sizes" id="sizes"></div>
  <div class="s-label">Sizes available</div>
  <div class="order">
    <img id="qr" alt="QR code to order">
    <div class="order-txt">Orders are taken through our form only. Scan the QR code or tap the button below.</div>
  </div>
  <a class="ask" id="ask" target="_blank" rel="noopener">Click here to order</a>
</aside>

<script>
/* =========================================================
   EDIT HERE — brand, contact and products.
   ========================================================= */
const CONFIG = {
  brand: "UUM Handball Team",
  logo: "images/logo.webp",
  currency: "RM",
  orderUrl: "https://docs.google.com/forms/d/e/1FAIpQLSck0-ZUD-r7XPFyxJiuvg9NA9yaCiHwHcUxmsvEWEG8bRDnKQ/viewform?usp=publish-editor",
  qr: "images/qr.png"
};

// group: items in the same group show as hang tags you can switch between
const PRODUCTS = [
  { name:"Turquoise Training Kit", kind:"Training kit", price:35, group:"training", tag:"Turquoise",
    tagColor:"#3f8c9e", tagText:"#e9c96a", front:"images/turquoise-front.webp", back:"images/turquoise-back.webp" },
  { name:"Polo Collar Jersey", kind:"Northern Panthers jersey", price:39, group:"polo", tag:"Jersey",
    tagColor:"#1f2a3a", tagText:"#4f8be0", front:"images/polo-front.webp", back:"images/polo-back.webp" },
  { name:"Purple Training Kit", kind:"Training kit", price:35, group:"training", tag:"Purple",
    tagColor:"#37305e", tagText:"#e57bb2", front:"images/purple-front.webp", back:"images/purple-back.webp" }
];
const START = 1; // which item is out front when the page opens

const SIZES = ["XS","S","M","L","XL","2XL","3XL","4XL","5XL"];

function garment(p, side){
  return `<img src="${p[side]}" alt="${p.name} — ${side}" draggable="false">`;
}

/* ================== APP ================== */
const $ = id => document.getElementById(id);
const hoverable = matchMedia("(hover:hover) and (pointer:fine)").matches;
let idx = START, side = "front", sizeSel = null;

$("logo").innerHTML = (CONFIG.logo ? `<img src="${CONFIG.logo}" alt="">` : "") + `<span>${CONFIG.brand}</span>`;
$("footer").textContent = `© ${new Date().getFullYear()} ${CONFIG.brand}`;
$("hint").textContent = hoverable ? "Hover to browse · Click to view" : "Swipe or tap to browse · Tap again to view";
document.title = CONFIG.brand;
PRODUCTS.forEach(p=>{ ["front","back"].forEach(k=>{ const i=new Image(); i.src=p[k]; }); });

function renderRack(){
  $("items").innerHTML = PRODUCTS.map((p,i)=>
    `<button class="slot" role="option" data-i="${i}" aria-label="${p.name}"><div class="g">${garment(p,"front")}</div></button>`).join("");
  select(idx);
}
function select(i){
  idx = (i + PRODUCTS.length) % PRODUCTS.length;
  document.querySelectorAll(".slot").forEach((s,k)=>{ s.classList.toggle("active",k===idx); s.setAttribute("aria-selected",k===idx); });
  const p = PRODUCTS[idx];
  $("capName").textContent = p.name;
  $("capMeta").textContent = `${p.kind} · ${CONFIG.currency}${p.price}`;
}
function renderDetail(anim){
  const p = PRODUCTS[idx];
  const draw = ()=>{ $("fig").innerHTML = garment(p,side); };
  if (anim){ $("fig").classList.add("flip"); setTimeout(()=>{ draw(); $("fig").classList.remove("flip"); },160); } else draw();
  $("tags").innerHTML = PRODUCTS.map((q,k)=>[q,k]).filter(([q])=>q.group===p.group).map(([q,k])=>
    `<button class="tag${k===idx?" on":""}" data-k="${k}" style="--c:${q.tagColor};--t:${q.tagText}" aria-label="${q.name}"><span>${q.tag}</span></button>`).join("");
  $("dName").textContent = p.name;
  $("dPrice").textContent = `${CONFIG.currency}${p.price}`;
  $("front").classList.toggle("on", side==="front");
  $("back").classList.toggle("on", side==="back");
}
function open(){ side="front"; renderDetail(); document.body.classList.add("open"); $("detail").setAttribute("aria-hidden","false"); }
function close(){ document.body.classList.remove("open"); $("detail").setAttribute("aria-hidden","true"); }
function step(d){ select(idx+d); if (document.body.classList.contains("open")){ side="front"; renderDetail(true); } }

$("items").addEventListener("click", e=>{
  const s = e.target.closest(".slot"); if(!s) return;
  const i = +s.dataset.i;
  if (i===idx || hoverable){ select(i); open(); } else select(i);
});
if (hoverable) $("items").addEventListener("pointerover", e=>{ const s=e.target.closest(".slot"); if(s) select(+s.dataset.i); });

$("capOpen").onclick = ()=>{ open(); openSheet(); };
$("close").onclick = close;
$("prev").onclick = ()=>step(-1);
$("next").onclick = ()=>step(1);
$("front").onclick = ()=>{ if(side!=="front"){ side="front"; renderDetail(true);} };
$("back").onclick  = ()=>{ if(side!=="back"){ side="back"; renderDetail(true);} };
$("tags").addEventListener("click", e=>{
  const t = e.target.closest(".tag"); if(!t) return;
  const k = +t.dataset.k;
  if (k===idx){ t.classList.remove("swing"); void t.offsetWidth; t.classList.add("swing"); return; }
  select(k); renderDetail(true);
  $("tags").querySelector(`[data-k="${k}"]`).classList.add("swing");
});

/* availability */
function openSheet(){
  const p = PRODUCTS[idx]; sizeSel = null;
  $("sTitle").textContent = p.name;
  $("sSub").textContent = `${p.kind} · ${CONFIG.currency}${p.price}`;
  $("sizes").innerHTML = SIZES.map(s=>`<div class="size"><b>${s}</b></div>`).join("");
  updateAsk();
  document.body.classList.add("sheet-on");
}
function updateAsk(){}
$("ask").href = CONFIG.orderUrl;
$("qr").src = CONFIG.qr;
const closeSheet = ()=>document.body.classList.remove("sheet-on");
$("avail").onclick = openSheet;
$("sClose").onclick = closeSheet;
$("scrim").onclick = closeSheet;

/* keyboard + swipe */
document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){ document.body.classList.contains("sheet-on") ? closeSheet() : close(); }
  if (document.body.classList.contains("sheet-on")) return;
  if (e.key==="ArrowRight") step(1);
  if (e.key==="ArrowLeft") step(-1);
  if (e.key==="Enter" && !document.body.classList.contains("open") && document.activeElement===document.body) open();
});
let tx=null, ty=null;
$("stage").addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
$("stage").addEventListener("touchend", e=>{
  if (tx===null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx=null;
  if (Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
});
let sy=null;
$("sheet").addEventListener("touchstart", e=>{ sy=e.touches[0].clientY; }, {passive:true});
$("sheet").addEventListener("touchend", e=>{ if(sy!==null && e.changedTouches[0].clientY-sy>60) closeSheet(); sy=null; });

renderRack();
(function(){ // 10-second loading screen
  const T=7000, t0=performance.now();
  (function tick(){ const p=Math.min(1,(performance.now()-t0)/T); $("lpct").textContent=Math.round(p*100)+"%"; document.querySelector(".l-bar i").style.width=(p*100)+"%";
    if(p<1) requestAnimationFrame(tick); else { $("loader").classList.add("done"); document.body.classList.remove("loading"); } })();
})();
</script>
</body>
</html>
